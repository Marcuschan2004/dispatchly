services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dispatchly
      POSTGRES_PASSWORD: dispatchly
      POSTGRES_DB: dispatchly
    ports:
      - "5433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatchly"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
